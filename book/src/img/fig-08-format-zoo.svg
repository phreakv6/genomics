<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="360" rx="8" fill="#faf9f7"/>
  <style>
    .box { fill: #ffffff; stroke: #c9c4bb; stroke-width: 1.5; }
    .fmt { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #2b2b2b; }
    .say { font-size: 12.5px; fill: #6a6f75; font-style: italic; }
    .step { font-size: 12.5px; fill: #4a7fb5; font-weight: 600; }
    .arrow { stroke: #4a7fb5; stroke-width: 2; fill: none; marker-end: url(#ah8); }
    .side { stroke: #c9c4bb; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#ah8g); }
  </style>
  <defs>
    <marker id="ah8" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" stroke="#4a7fb5" stroke-width="1.5" fill="none"/>
    </marker>
    <marker id="ah8g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" stroke="#c9c4bb" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <!-- FASTA -->
  <rect x="30" y="40" width="260" height="52" rx="6" class="box"/>
  <text x="45" y="62" class="fmt">FASTA</text>
  <text x="45" y="81" class="say">“here is the reference sequence”</text>

  <!-- FASTQ -->
  <rect x="350" y="40" width="260" height="52" rx="6" class="box"/>
  <text x="365" y="62" class="fmt">FASTQ</text>
  <text x="365" y="81" class="say">“reads + how confident the machine was”</text>

  <!-- aligner -->
  <text x="243" y="130" class="step">aligner (bwa) — needs both</text>
  <line x1="160" y1="96" x2="300" y2="152" class="arrow"/>
  <line x1="480" y1="96" x2="340" y2="152" class="arrow"/>

  <!-- SAM/BAM -->
  <rect x="190" y="156" width="260" height="52" rx="6" class="box"/>
  <text x="205" y="178" class="fmt">SAM / BAM</text>
  <text x="205" y="197" class="say">“where each read goes on the reference”</text>

  <!-- caller -->
  <text x="243" y="242" class="step">variant caller (bcftools)</text>
  <line x1="320" y1="212" x2="320" y2="264" class="arrow"/>

  <!-- VCF -->
  <rect x="190" y="268" width="260" height="52" rx="6" class="box"/>
  <text x="205" y="290" class="fmt">VCF</text>
  <text x="205" y="309" class="say">“where this sample differs from the reference”</text>

  <!-- BED/GFF sidecar -->
  <rect x="480" y="212" width="130" height="108" rx="6" class="box"/>
  <text x="495" y="236" class="fmt">BED / GFF</text>
  <text x="495" y="256" class="say">“this region is a</text>
  <text x="495" y="272" class="say">gene / exon /</text>
  <text x="495" y="288" class="say">high-confidence…”</text>
  <text x="495" y="310" class="say">joins in anywhere</text>
  <line x1="478" y1="266" x2="454" y2="266" class="side"/>
</svg>
