<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" rx="8" fill="#faf9f7"/>
  <style>
    .seq { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 20px; fill: #2b2b2b; letter-spacing: 6px; }
    .prime { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 15px; fill: #8a8a8a; }
    .lbl { font-size: 13px; fill: #6a6f75; }
    .accent { fill: #b0413e; }
    .bond { stroke: #c9c4bb; stroke-width: 1.5; }
    .arrow { stroke: #4a7fb5; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" stroke="#4a7fb5" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <!-- given strand -->
  <text x="30" y="72" class="prime">5'-</text>
  <text x="80" y="72" class="seq">ACGTTGCA</text>
  <text x="300" y="72" class="prime">-3'</text>
  <text x="360" y="72" class="lbl">the strand you were given</text>

  <!-- base-pair bonds -->
  <line x1="88" y1="82" x2="88" y2="108" class="bond"/>
  <line x1="114" y1="82" x2="114" y2="108" class="bond"/>
  <line x1="140" y1="82" x2="140" y2="108" class="bond"/>
  <line x1="166" y1="82" x2="166" y2="108" class="bond"/>
  <line x1="192" y1="82" x2="192" y2="108" class="bond"/>
  <line x1="218" y1="82" x2="218" y2="108" class="bond"/>
  <line x1="244" y1="82" x2="244" y2="108" class="bond"/>
  <line x1="270" y1="82" x2="270" y2="108" class="bond"/>

  <!-- complement strand -->
  <text x="30" y="130" class="prime">3'-</text>
  <text x="80" y="130" class="seq">TGCAACGT</text>
  <text x="300" y="130" class="prime">-5'</text>
  <text x="360" y="130" class="lbl">its partner: A↔T, C↔G, and it</text>
  <text x="360" y="147" class="lbl">runs the other way (antiparallel)</text>

  <!-- read direction arrow -->
  <path d="M 290 168 C 240 190, 130 190, 92 172" class="arrow"/>
  <text x="120" y="207" class="lbl">but convention says: always read 5' → 3',</text>
  <text x="120" y="223" class="lbl">so write the partner starting from ITS 5' end</text>

  <!-- reverse complement -->
  <text x="30" y="265" class="prime">5'-</text>
  <text x="80" y="265" class="seq"><tspan class="accent">TGCAACGT</tspan></text>
  <text x="300" y="265" class="prime">-3'</text>
  <text x="360" y="265" class="lbl">the reverse complement —</text>
  <text x="360" y="282" class="lbl">complement, read backwards</text>
</svg>
