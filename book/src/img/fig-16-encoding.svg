<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" rx="8" fill="#faf9f7"/>
  <style>
    .lbl { font-size: 13px; fill: #6a6f75; }
    .flbl { font-size: 13px; fill: #2b2b2b; font-weight: 600; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #2b2b2b; }
    .num { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 15px; fill: #4a7fb5; font-weight: 700; text-anchor: middle; }
    .cell { fill: #ffffff; stroke: #c9c4bb; stroke-width: 1; }
    .head { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #8a8a8a; text-anchor: middle; }
    .arrow { stroke: #4a7fb5; stroke-width: 2; fill: none; marker-end: url(#ah16); }
  </style>
  <defs>
    <marker id="ah16" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" stroke="#4a7fb5" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <text x="30" y="36" class="flbl">the VCF (rows = variant sites, columns = people)</text>
  <text x="120" y="62" class="head">NA00001</text><text x="200" y="62" class="head">NA00002</text><text x="280" y="62" class="head">NA00003</text>
  <text x="50" y="84" class="mono">site 1</text>
  <text x="50" y="110" class="mono">site 2</text>
  <text x="50" y="136" class="mono">site 3</text>
  <text x="120" y="84" class="mono" text-anchor="middle">0/0</text><text x="200" y="84" class="mono" text-anchor="middle">0/1</text><text x="280" y="84" class="mono" text-anchor="middle">1/1</text>
  <text x="120" y="110" class="mono" text-anchor="middle">0/1</text><text x="200" y="110" class="mono" text-anchor="middle">0/0</text><text x="280" y="110" class="mono" text-anchor="middle">0/1</text>
  <text x="120" y="136" class="mono" text-anchor="middle">1/1</text><text x="200" y="136" class="mono" text-anchor="middle">1/1</text><text x="280" y="136" class="mono" text-anchor="middle">0/0</text>

  <line x1="330" y1="105" x2="395" y2="105" class="arrow"/>
  <text x="362" y="90" class="lbl" text-anchor="middle">count the</text>
  <text x="362" y="126" class="lbl" text-anchor="middle">1s</text>

  <text x="415" y="36" class="flbl">the matrix G</text>
  <rect x="425" y="68" width="46" height="26" class="cell"/><rect x="471" y="68" width="46" height="26" class="cell"/><rect x="517" y="68" width="46" height="26" class="cell"/>
  <rect x="425" y="94" width="46" height="26" class="cell"/><rect x="471" y="94" width="46" height="26" class="cell"/><rect x="517" y="94" width="46" height="26" class="cell"/>
  <rect x="425" y="120" width="46" height="26" class="cell"/><rect x="471" y="120" width="46" height="26" class="cell"/><rect x="517" y="120" width="46" height="26" class="cell"/>
  <text x="448" y="87" class="num">0</text><text x="494" y="87" class="num">1</text><text x="540" y="87" class="num">2</text>
  <text x="448" y="113" class="num">1</text><text x="494" y="113" class="num">0</text><text x="540" y="113" class="num">1</text>
  <text x="448" y="139" class="num">2</text><text x="494" y="139" class="num">2</text><text x="540" y="139" class="num">0</text>

  <text x="30" y="196" class="flbl">the encoding: count of alternate alleles</text>
  <text x="50" y="222" class="mono">0/0 → 0   homozygous reference</text>
  <text x="50" y="244" class="mono">0/1 → 1   heterozygous</text>
  <text x="50" y="266" class="mono">1/1 → 2   homozygous alternate</text>

  <text x="360" y="222" class="lbl">2,504 people × 14,082 sites of real</text>
  <text x="360" y="239" class="lbl">chr22 data → an integer matrix.</text>
  <text x="360" y="256" class="lbl">From here, population genetics is</text>
  <text x="360" y="273" class="lbl">multivariate statistics.</text>
</svg>
