<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" rx="8" fill="#faf9f7"/>
  <style>
    .lbl { font-size: 13px; fill: #6a6f75; }
    .flbl { font-size: 13px; fill: #2b2b2b; font-weight: 600; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #2b2b2b; }
    .bar { fill: #ffffff; stroke: #c9c4bb; stroke-width: 1.5; }
    .blk { fill: rgba(74,127,181,0.25); stroke: #4a7fb5; stroke-width: 1.3; }
    .idx { fill: rgba(150,150,150,0.15); stroke: #9a9a9a; stroke-width: 1.2; }
    .arrow { stroke: #4a7fb5; stroke-width: 1.8; fill: none; marker-end: url(#ah14); }
    .step { font-size: 12.5px; fill: #4a7fb5; font-weight: 600; }
  </style>
  <defs>
    <marker id="ah14" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" stroke="#4a7fb5" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <text x="30" y="36" class="flbl">NCBI server</text>
  <!-- big remote BAM -->
  <rect x="30" y="48" width="580" height="40" class="bar"/>
  <rect x="392" y="48" width="26" height="40" class="blk"/>
  <text x="40" y="73" class="mono">HG002.GRCh38.300x.bam — ~250 GB, coordinate-sorted BGZF blocks</text>

  <!-- index -->
  <rect x="30" y="112" width="200" height="30" class="idx"/>
  <text x="40" y="132" class="mono">.bai index — a few MB</text>

  <text x="250" y="132" class="lbl">maps chr11:5,200,000–5,300,000 → exactly which</text>
  <text x="250" y="148" class="lbl">byte ranges of the BAM contain those reads</text>

  <!-- laptop -->
  <text x="30" y="204" class="flbl">your laptop</text>
  <rect x="30" y="216" width="360" height="34" class="bar"/>
  <rect x="40" y="222" width="60" height="22" class="blk"/>
  <text x="110" y="238" class="mono">region.300x.bam — 19 MB, 213,881 reads</text>

  <!-- arrows -->
  <path d="M 130 142 C 130 170, 90 190, 80 214" class="arrow"/>
  <text x="140" y="180" class="step">1. fetch index, look up region</text>
  <path d="M 405 90 C 405 150, 200 190, 105 222" class="arrow"/>
  <text x="380" y="180" class="step">2. HTTP range-request only those blocks</text>

  <text x="30" y="286" class="lbl">samtools view -b -o region.300x.bam "$URL" chr11:5200000-5300000 — 0.008% of the file moves</text>
</svg>
