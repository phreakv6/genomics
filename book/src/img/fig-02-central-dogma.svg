<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="210" rx="8" fill="#faf9f7"/>
  <style>
    .box { fill: #ffffff; stroke: #c9c4bb; stroke-width: 1.5; rx: 6; }
    .name { font-size: 17px; font-weight: 600; fill: #2b2b2b; }
    .sub { font-size: 12px; fill: #6a6f75; }
    .step { font-size: 13px; fill: #4a7fb5; font-weight: 600; }
    .op { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #8a8a8a; }
    .arrow { stroke: #4a7fb5; stroke-width: 2; fill: none; marker-end: url(#ah2); }
  </style>
  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" stroke="#4a7fb5" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <rect x="30" y="60" width="150" height="80" rx="6" class="box"/>
  <text x="105" y="92" text-anchor="middle" class="name">DNA</text>
  <text x="105" y="112" text-anchor="middle" class="sub">alphabet {A,C,G,T}</text>
  <text x="105" y="128" text-anchor="middle" class="sub">double-stranded, stored</text>

  <rect x="245" y="60" width="150" height="80" rx="6" class="box"/>
  <text x="320" y="92" text-anchor="middle" class="name">RNA</text>
  <text x="320" y="112" text-anchor="middle" class="sub">alphabet {A,C,G,U}</text>
  <text x="320" y="128" text-anchor="middle" class="sub">single-stranded, working copy</text>

  <rect x="460" y="60" width="150" height="80" rx="6" class="box"/>
  <text x="535" y="92" text-anchor="middle" class="name">Protein</text>
  <text x="535" y="112" text-anchor="middle" class="sub">20 amino acids</text>
  <text x="535" y="128" text-anchor="middle" class="sub">folds, does the work</text>

  <line x1="182" y1="100" x2="240" y2="100" class="arrow"/>
  <text x="211" y="48" text-anchor="middle" class="step">transcription</text>
  <text x="211" y="163" text-anchor="middle" class="op">s.replace("T","U")</text>

  <line x1="397" y1="100" x2="455" y2="100" class="arrow"/>
  <text x="426" y="48" text-anchor="middle" class="step">translation</text>
  <text x="426" y="163" text-anchor="middle" class="op">codon table, 3 at a time</text>

  <text x="320" y="196" text-anchor="middle" class="sub">information flows this way — that one-way claim is the “central dogma” (Crick, 1958)</text>
</svg>
