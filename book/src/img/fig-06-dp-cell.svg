<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" rx="8" fill="#faf9f7"/>
  <style>
    .cell { fill: #ffffff; stroke: #c9c4bb; stroke-width: 1.5; }
    .target { fill: rgba(74,127,181,0.12); stroke: #4a7fb5; stroke-width: 2; }
    .t { font-size: 14px; fill: #2b2b2b; text-anchor: middle; }
    .m { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #2b2b2b; text-anchor: middle; }
    .lbl { font-size: 12.5px; fill: #6a6f75; }
    .move { font-size: 12.5px; fill: #4a7fb5; font-weight: 600; }
    .arrow { stroke: #4a7fb5; stroke-width: 2; fill: none; marker-end: url(#ah6); }
  </style>
  <defs>
    <marker id="ah6" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" stroke="#4a7fb5" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <!-- 2x2 of cells: (i-1,j-1) (i-1,j) / (i,j-1) (i,j) -->
  <rect x="150" y="50"  width="150" height="80" class="cell"/>
  <rect x="300" y="50"  width="150" height="80" class="cell"/>
  <rect x="150" y="130" width="150" height="80" class="cell"/>
  <rect x="300" y="130" width="150" height="80" class="target"/>

  <text x="225" y="80" class="m">F(i−1, j−1)</text>
  <text x="375" y="80" class="m">F(i−1, j)</text>
  <text x="225" y="160" class="m">F(i, j−1)</text>
  <text x="375" y="160" class="m">F(i, j)</text>
  <text x="375" y="182" class="t">= max of the three</text>

  <!-- arrows into (i,j) -->
  <line x1="255" y1="95"  x2="340" y2="145" class="arrow"/>
  <line x1="375" y1="105" x2="375" y2="140" class="arrow"/>
  <line x1="262" y1="170" x2="308" y2="170" class="arrow"/>

  <!-- annotations -->
  <text x="60"  y="34" class="move">diagonal</text>
  <text x="60"  y="50" class="lbl">align a[i] with b[j]:</text>
  <text x="60"  y="66" class="lbl">+match / −mismatch</text>
  <line x1="120" y1="55" x2="205" y2="72" class="arrow"/>

  <text x="480" y="34" class="move">from above</text>
  <text x="480" y="50" class="lbl">consume a[i],</text>
  <text x="480" y="66" class="lbl">gap in b: −gap</text>
  <line x1="475" y1="55" x2="392" y2="72" class="arrow"/>

  <text x="60"  y="240" class="move">from the left</text>
  <text x="60"  y="256" class="lbl">consume b[j],</text>
  <text x="60"  y="272" class="lbl">gap in a: −gap</text>
  <line x1="120" y1="245" x2="210" y2="200" class="arrow"/>

  <text x="480" y="248" class="lbl">every cell records the best</text>
  <text x="480" y="264" class="lbl">way to get there; traceback</text>
  <text x="480" y="280" class="lbl">replays the winning moves</text>
</svg>
