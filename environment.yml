# Conda environment for all five modules.
#
# macOS on Apple Silicon (M1/M2/M3/M4) -- IMPORTANT:
#   Much of bioconda has no osx-arm64 build. Create the environment under the
#   Intel subdir and let Rosetta translate:
#
#     CONDA_SUBDIR=osx-64 conda env create -f environment.yml
#     conda activate bio
#     conda config --env --set subdir osx-64      # so later installs match
#
#   The first Python import takes ~50s while Rosetta caches translations.
#   After that it is fast. Without CONDA_SUBDIR, conda reports these packages
#   as simply nonexistent, which is a confusing error for a package that
#   obviously exists.
#
# Linux, Intel Mac, or WSL:
#     conda env create -f environment.yml
#     conda activate bio
#
# Versions are pinned to minor releases -- loose enough to resolve for a while,
# tight enough that output stays comparable. Reproducibility is a real value in
# this field, not a nicety; see Buffalo ch. 12.

name: bio

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.11

  # --- command-line core ---
  - samtools=1.24        # everything BAM: view, sort, index, depth, mpileup
  - bcftools=1.24        # everything VCF: call, norm, filter, isec, query
  - htslib=1.24          # the library underneath both, plus tabix/bgzip
  - bedtools=2.31        # interval arithmetic
  - bwa=0.7              # short-read aligner (BWT/FM-index)
  - minimap2=2.31        # long-read aligner; not used yet, worth having

  # --- python ---
  - numpy>=2.0
  - pandas>=2.0
  - matplotlib>=3.8
  - pysam=0.24           # read BAM/VCF programmatically
  - scikit-allel=1.3     # population genetics: PCA, LD pruning, allele counts
  - biopython=1.87       # sequence utilities, parsers, format conversion
